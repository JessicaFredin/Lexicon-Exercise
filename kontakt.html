<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />
    <title>Pannkaksrecept</title>
</head>

<body>
    <a class="skip-link" href="#main">Hoppa till innehåll</a>
    <header class="nav-header">
        <div><a href="/" class="logo">Pancakes.com</a></div>
        <nav>
            <ul>
                <li><a href="recept.html">Recept</a></li>
                <li><a href="/">Om oss</a></li>
                <li><a href="/">Kontakt</a></li>
            </ul>
        </nav>
        <button>Logga in</button>
    </header>

    <section class="hero-banner">
        <img src="https://img.koket.se/standard-mega/pannkaka-ny.jpg" alt="Pannkakor med hallon och grädde">

        <div class="hero-content">
            <h1>Pannkakor, pannkakor, pannkakor</h1>
            <p class="subtitle">– i alla dess former och variationer</p>
        </div>
    </section>

    <form action="#" method="post">
            <h2>Kontakta oss</h2>

            <label for="name">Namn:</label>
            <input type="text" id="name" name="name" required />

            <label for="email">E-post:</label>
            <input type="email" id="email" name="email" required />

            <label for="message">Meddelande:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Skicka</button>
    </form>

    
</body>

</html>
